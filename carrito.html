<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito - Patitas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="barra">
            <a class="logo" href="pets.html">
                <img src="fotos/logo.png" alt="logo de Patitas">
                <span>Patitas</span>
            </a>
            <nav>
                <a class="boton" href="pets.html">Inicio</a>
                <a class="boton" href="productos.html">Productos</a>
                <a class="boton" href="servicios.html">Servicios</a>
                <a class="boton" href="nosotros.html">Nosotros</a>
                <a class="boton" href="blogs.html">Blogs</a>
                <a class="boton" href="contacto.html">Contacto</a>
            </nav>
            <a class="carrito" href="carrito.html">Carrito (<span id="contadorCarrito">0</span>)</a>
        </div>
        <div class="sesion" id="barraSesion"></div>
    </header>

    <main>
        <h1 class="titulo">Mi carrito de compras</h1>

        <div class="carrito-caja">
            <section class="carrito-items" id="listaCarrito"></section>

            <aside class="resumen">
                <h3>Resumen</h3>
                <p><span>Subtotal</span> <span id="subtotal">$0</span></p>
                <p><span>Descuento</span> <span id="descuento">$0</span></p>
                <p><span>Despacho</span> <span id="despacho">Gratis</span></p>
                <p class="total"><span>Total</span> <span id="totalCarrito">$0</span></p>

                <label for="cupon">Ingresa el cupon de descuento</label>
                <input type="text" id="cupon" placeholder="PATITAS10">
                <button class="boton-gris ancho-total" onclick="aplicarCupon()">Aplicar cupon</button>
                <div id="mensajeCupon"></div>

                <button class="ancho-total" onclick="pagar()">Pagar</button>
                <button class="boton-rojo ancho-total" onclick="vaciarCarrito()">Vaciar carrito</button>
            </aside>
        </div>
    </main>

    <footer>
        <p>Patitas | Av. Don Ramon 1234, Santiago | +56 2 2345 6789</p>
        <p>2026 todos los derechos reservados a patitas.cl</p>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/sesion.js"></script>
    <script>
        mostrarCarrito();
    </script>
</body>
</html>
